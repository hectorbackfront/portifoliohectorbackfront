<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="page-title">Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--dark);color:var(--text);font-family:'Syne',sans-serif;overflow-x:hidden;cursor:none}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cursor{position:fixed;width:12px;height:12px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .1s;mix-blend-mode:screen;background:var(--accent)}
.cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(var(--accent-rgb),.5);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:all .15s ease}
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.2rem 3rem;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(20px);background:rgba(5,10,15,.7);border-bottom:1px solid rgba(var(--accent-rgb),.15)}
.nav-logo{font-family:'JetBrains Mono',monospace;font-size:.85rem;letter-spacing:.1em;color:var(--accent)}
.nav-links{display:flex;gap:2rem;list-style:none}
.nav-links a{color:var(--muted);text-decoration:none;font-size:.85rem;letter-spacing:.08em;transition:color .2s}
.nav-links a:hover{color:var(--accent)}
.badge-avail{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--accent);border:1px solid rgba(var(--accent-rgb),.4);padding:.3rem .8rem;border-radius:2rem;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--accent-rgb),.4)}50%{box-shadow:0 0 0 6px rgba(var(--accent-rgb),0)}}
section{position:relative;z-index:1;padding:5rem 6rem}
#hero{min-height:100vh;display:flex;align-items:center}
.hero-inner{max-width:900px}
.hero-tag{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent);letter-spacing:.15em;margin-bottom:1.5rem;opacity:.8}
.hero-title{font-size:clamp(3.5rem,9vw,8rem);font-weight:800;line-height:1;margin-bottom:1.5rem}
.hero-title .line2{color:var(--accent);display:block}
.hero-desc{font-size:1.1rem;color:var(--muted);max-width:500px;line-height:1.8;margin-bottom:2.5rem}
.hero-stats{display:flex;gap:3rem;margin-bottom:2.5rem}
.stat-num{font-size:2.5rem;font-weight:800;color:var(--accent);font-family:'JetBrains Mono',monospace}
.stat-label{font-size:.75rem;color:var(--muted);letter-spacing:.1em}
.hero-cta{display:flex;gap:1rem;flex-wrap:wrap}
.btn{padding:.85rem 2rem;font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;letter-spacing:.05em;border-radius:.3rem;cursor:pointer;text-decoration:none;transition:all .3s;border:none}
.btn-primary{background:var(--accent);color:#050A0F}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(var(--accent-rgb),.4)}
.btn-outline{border:1px solid rgba(var(--accent-rgb),.4);color:var(--accent);background:transparent}
.btn-outline:hover{background:rgba(var(--accent-rgb),.1);transform:translateY(-2px)}
.section-tag{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--accent);letter-spacing:.15em;margin-bottom:1rem;opacity:.7}
.section-title{font-size:clamp(2rem,4vw,3rem);font-weight:800;margin-bottom:3rem;line-height:1.1}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}
.about-text p{color:var(--muted);line-height:1.9;font-size:.95rem;margin-bottom:1.2rem}
.about-text blockquote{border-left:2px solid var(--accent);padding-left:1.2rem;color:var(--text);font-style:italic;margin-top:1.5rem;line-height:1.8}
.about-cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.about-card{background:rgba(var(--accent-rgb),.05);border:1px solid rgba(var(--accent-rgb),.1);border-radius:.5rem;padding:1.5rem;transition:all .3s}
.about-card:hover{border-color:rgba(var(--accent-rgb),.3);transform:translateY(-3px)}
.about-card-icon{font-size:1.5rem;margin-bottom:.8rem}
.about-card h4{font-size:.9rem;margin-bottom:.4rem}
.about-card p{font-size:.8rem;color:var(--muted);line-height:1.6}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.2rem}
.skill-card{background:var(--card);border:1px solid rgba(var(--accent-rgb),.1);border-radius:.5rem;padding:1.5rem;transition:all .3s;cursor:default;--mx:50%;--my:50%}
.skill-card:hover{border-color:rgba(var(--accent-rgb),.4)}
.skill-name{font-weight:700;margin-bottom:.8rem;font-size:.9rem}
.skill-bar-bg{height:3px;background:rgba(var(--accent-rgb),.1);border-radius:2px;overflow:hidden}
.skill-bar{height:100%;background:var(--accent);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(.16,1,.3,1)}
.skill-pct{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--accent);margin-top:.5rem;opacity:.7}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}
.project-card{background:var(--card);border:1px solid rgba(var(--accent-rgb),.1);border-radius:.6rem;padding:2rem;transition:all .3s;cursor:default;position:relative;overflow:hidden}
.project-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(var(--accent-rgb),.06),transparent 70%);opacity:0;transition:opacity .3s}
.project-card:hover::before{opacity:1}
.project-card:hover{border-color:rgba(var(--accent-rgb),.35);transform:translateY(-4px)}
.project-tag{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--accent);letter-spacing:.12em;margin-bottom:.8rem;opacity:.7}
.project-card h3{font-size:1.2rem;margin-bottom:.6rem}
.project-card p{color:var(--muted);font-size:.85rem;line-height:1.7;margin-bottom:1.2rem}
.project-tech{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
.tech-tag{font-family:'JetBrains Mono',monospace;font-size:.65rem;padding:.2rem .6rem;border:1px solid rgba(var(--accent-rgb),.25);border-radius:.2rem;color:var(--muted)}
.project-links{display:flex;gap:1rem}
.project-link{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--accent);text-decoration:none;opacity:.8;transition:opacity .2s}
.project-link:hover{opacity:1}
.contact-inner{max-width:700px}
.contact-links{display:flex;flex-direction:column;gap:.8rem;margin-top:2rem}
.contact-link{color:var(--muted);text-decoration:none;font-size:.95rem;transition:color .2s;display:flex;align-items:center;gap:.8rem}
.contact-link:hover{color:var(--accent)}
footer{position:relative;z-index:1;text-align:center;padding:2rem;font-size:.75rem;color:var(--muted);border-top:1px solid rgba(var(--accent-rgb),.1)}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s ease,transform .8s ease}
.reveal.in-view{opacity:1;transform:translateY(0)}
@media(max-width:768px){section{padding:3rem 1.5rem}nav{padding:1rem 1.5rem}.nav-links{display:none}.about-grid{grid-template-columns:1fr}.hero-stats{gap:1.5rem}.about-cards{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>
<canvas id="bg-canvas"></canvas>

<nav>
  <div class="nav-logo" id="nav-logo"></div>
  <ul class="nav-links">
    <li><a href="#about">Sobre</a></li>
    <li><a href="#skills">Skills</a></li>
    <li><a href="#projects">Projetos</a></li>
    <li><a href="#contact">Contato</a></li>
  </ul>
  <div class="badge-avail" id="nav-status"></div>
</nav>

<section id="hero">
  <div class="hero-inner">
    <div class="hero-tag" id="hero-tag"></div>
    <h1 class="hero-title">
      <span class="line1" id="hero-name-1"></span>
      <span class="line2" id="hero-name-2"></span>
    </h1>
    <p class="hero-desc" id="hero-desc"></p>
    <div class="hero-stats" id="hero-stats"></div>
    <div class="hero-cta">
      <a href="#projects" class="btn btn-primary">Ver Projetos</a>
      <a href="#contact" class="btn btn-outline">Entre em Contato</a>
    </div>
  </div>
</section>

<section id="about">
  <div class="section-tag reveal">// sobre mim</div>
  <h2 class="section-title reveal" id="about-title"></h2>
  <div class="about-grid">
    <div class="about-text reveal" id="about-text"></div>
    <div class="about-cards reveal" id="about-cards"></div>
  </div>
</section>

<section id="skills">
  <div class="section-tag reveal">// skills</div>
  <h2 class="section-title reveal">Tecnologias & Ferramentas</h2>
  <div class="skills-grid reveal" id="skills-grid"></div>
</section>

<section id="projects">
  <div class="section-tag reveal">// projetos</div>
  <h2 class="section-title reveal">O que eu construí</h2>
  <div class="projects-grid" id="projects-grid"></div>
</section>

<section id="contact">
  <div class="contact-inner">
    <div class="section-tag reveal">// contato</div>
    <h2 class="section-title reveal" id="contact-title"></h2>
    <p class="reveal" id="contact-desc" style="color:var(--muted);font-size:.9rem;line-height:1.8"></p>
    <div class="contact-links reveal" id="contact-links"></div>
  </div>
</section>

<footer id="footer-text"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════
//  CONFIG — edite aqui ou use o editor visual
// ═══════════════════════════════════════════════
const CONFIG = {
  accent: "#00E5FF",
  dark: "#050A0F",
  name: ["Hector", "Marcelo"],
  tagline: "Dev em Ascensão",
  status: "Disponível",
  description: "3º semestre de ADS • Piracaia, SP — construindo o futuro com código, estratégia e muita vontade.",
  stats: [
    { num: "22", label: "Anos de idade" },
    { num: "3°", label: "Semestre ADS" },
    { num: "∞", label: "Ambição" }
  ],
  about: {
    title: "Quem sou eu?",
    paragraphs: [
      "Tenho <strong>22 anos</strong> e sou do interior de São Paulo — <strong>Piracaia</strong>. Estou no <strong>3° semestre de ADS</strong> e cada dia entendo mais porque escolhi essa área.",
      "Me identifico como alguém que une <strong>raciocínio técnico com habilidade humana</strong>."
    ],
    quote: "Cada linha de código que escrevo hoje é um tijolo de um projeto maior que ainda estou desenhando.",
    cards: [
      { icon: "📍", title: "Piracaia, SP", text: "Interior de São Paulo. Foco total e acesso ao mundo digital." },
      { icon: "🎓", title: "ADS — 3° Sem.", text: "Análise e Desenvolvimento de Sistemas em andamento." },
      { icon: "⚡", title: "Automação", text: "IIoT, SCADA e sistemas industriais." },
      { icon: "🤝", title: "Comunicação", text: "Soft skills que complementam o lado técnico." }
    ]
  },
  skills: [
    { name: "JavaScript", pct: 75 },
    { name: "Python", pct: 70 },
    { name: "Node.js", pct: 65 },
    { name: "HTML/CSS", pct: 85 },
    { name: "React", pct: 55 },
    { name: "SQL", pct: 60 }
  ],
  projects: [
    {
      tag: "WEB",
      title: "Guia Turístico Piracaia",
      desc: "Landing page para prefeitura com cadastro de pontos turísticos e planos de assinatura.",
      tech: ["HTML", "CSS", "JS", "Node.js"],
      github: "#",
      demo: "#"
    },
    {
      tag: "AUTOMAÇÃO",
      title: "Sistema IIoT",
      desc: "Monitoramento industrial em tempo real com dashboard de dados de sensores.",
      tech: ["Python", "MQTT", "Grafana"],
      github: "#",
      demo: "#"
    },
    {
      tag: "FULLSTACK",
      title: "Portfólio 3D",
      desc: "Este portfólio — feito com Three.js, efeitos 3D e design futurista.",
      tech: ["Three.js", "HTML", "CSS", "JS"],
      github: "#",
      demo: "#"
    }
  ],
  contact: {
    title: "Vamos Conversar?",
    desc: "Aberto a parcerias, projetos, estágios e trocas de conhecimento.",
    links: [
      { label: "✉️", text: "email@exemplo.com", href: "mailto:email@exemplo.com" },
      { label: "⬡", text: "GitHub", href: "https://github.com" },
      { label: "in", text: "LinkedIn", href: "https://linkedin.com" }
    ]
  },
  footer: "Construído com código, estratégia e muita vontade."
};

// ═══════════════════════════════════════════════
//  RENDER ENGINE
// ═══════════════════════════════════════════════
function hexToRgb(hex){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);return r?`${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}`:'0,229,255'}

function applyConfig(cfg){
  const root=document.documentElement;
  root.style.setProperty('--accent',cfg.accent);
  root.style.setProperty('--accent-rgb',hexToRgb(cfg.accent));
  root.style.setProperty('--dark',cfg.dark);
  root.style.setProperty('--dark2',cfg.dark+'dd');
  root.style.setProperty('--text','#E8F0FE');
  root.style.setProperty('--muted','#6B7FA3');
  root.style.setProperty('--card','rgba(10,18,32,.85)');

  document.title = cfg.name.join(' ');
  document.getElementById('nav-logo').textContent = cfg.name.map(n=>n.toUpperCase()).join('_')+'_';
  document.getElementById('nav-status').textContent = cfg.status;
  document.getElementById('hero-tag').textContent = cfg.tagline;
  document.getElementById('hero-name-1').textContent = cfg.name[0]||'';
  document.getElementById('hero-name-2').textContent = cfg.name[1]||'';
  document.getElementById('hero-desc').textContent = cfg.description;

  const statsEl=document.getElementById('hero-stats');
  statsEl.innerHTML=cfg.stats.map(s=>`<div class="stat"><div class="stat-num">${s.num}</div><div class="stat-label">${s.label}</div></div>`).join('');

  document.getElementById('about-title').textContent=cfg.about.title;
  document.getElementById('about-text').innerHTML=
    cfg.about.paragraphs.map(p=>`<p>${p}</p>`).join('')+
    `<blockquote>"${cfg.about.quote}"</blockquote>`;
  document.getElementById('about-cards').innerHTML=
    cfg.about.cards.map(c=>`<div class="about-card"><div class="about-card-icon">${c.icon}</div><h4>${c.title}</h4><p>${c.text}</p></div>`).join('');

  document.getElementById('skills-grid').innerHTML=
    cfg.skills.map(s=>`<div class="skill-card reveal"><div class="skill-name">${s.name}</div><div class="skill-bar-bg"><div class="skill-bar" style="--w:${s.pct/100}"></div></div><div class="skill-pct">${s.pct}%</div></div>`).join('');

  document.getElementById('projects-grid').innerHTML=
    cfg.projects.map(p=>`<div class="project-card reveal"><div class="project-tag">${p.tag}</div><h3>${p.title}</h3><p>${p.desc}</p><div class="project-tech">${p.tech.map(t=>`<span class="tech-tag">${t}</span>`).join('')}</div><div class="project-links"><a class="project-link" href="${p.github}" target="_blank">→ GitHub</a><a class="project-link" href="${p.demo}" target="_blank">↗ Demo</a></div></div>`).join('');

  document.getElementById('contact-title').textContent=cfg.contact.title;
  document.getElementById('contact-desc').textContent=cfg.contact.desc;
  document.getElementById('contact-links').innerHTML=
    cfg.contact.links.map(l=>`<a class="contact-link" href="${l.href}">${l.label} ${l.text}</a>`).join('');

  const nm=cfg.name.join(' ');
  document.getElementById('footer-text').textContent=`© ${new Date().getFullYear()} ${nm} — ${cfg.footer}`;

  initObserver();
}

function initObserver(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        e.target.classList.add('in-view');
        const bar=e.target.querySelector('.skill-bar');
        if(bar){setTimeout(()=>{bar.style.transform=`scaleX(${bar.style.getPropertyValue('--w')||.7})`},200)}
      }
    });
  },{threshold:.15});
  document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}

applyConfig(CONFIG);

// ═══ THREE.JS BACKGROUND ═══
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.z=30;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('bg-canvas'),alpha:true,antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));

function getAccentColor(){const s=getComputedStyle(document.documentElement).getPropertyValue('--accent-rgb').trim();const [r,g,b]=s.split(',').map(Number);return new THREE.Color(r/255,g/255,b/255)}

const particleGeo=new THREE.BufferGeometry();
const count=800;const pos=new Float32Array(count*3);
for(let i=0;i<count*3;i++)pos[i]=(Math.random()-.5)*120;
particleGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const particleMat=new THREE.PointsMaterial({size:.15,color:getAccentColor(),transparent:true,opacity:.5});
const particles=new THREE.Points(particleGeo,particleMat);
scene.add(particles);

const shapes=[];
const geos=[new THREE.IcosahedronGeometry(1.5,0),new THREE.OctahedronGeometry(1.2,0),new THREE.TorusGeometry(1,.3,6,8)];
for(let i=0;i<12;i++){
  const geo=geos[i%3];
  const mat=new THREE.MeshBasicMaterial({color:getAccentColor(),wireframe:true,transparent:true,opacity:.12+Math.random()*.08});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set((Math.random()-.5)*50,(Math.random()-.5)*30,(Math.random()-.5)*20);
  mesh._spd={x:Math.random()*.005,y:Math.random()*.005,z:Math.random()*.003};
  mesh._floatOffset=Math.random()*Math.PI*2;
  scene.add(mesh);shapes.push(mesh);
}

let pmx=0,pmy=0,t=0;
document.addEventListener('mousemove',e=>{pmx=(e.clientX/innerWidth-.5)*2;pmy=(e.clientY/innerHeight-.5)*2});
(function animate(){
  requestAnimationFrame(animate);t+=.005;
  camera.position.x+=(pmx*.8-camera.position.x)*.02;
  camera.position.y+=(-pmy*.5-camera.position.y)*.02;
  camera.lookAt(0,0,0);
  shapes.forEach(m=>{m.rotation.x+=m._spd.x;m.rotation.y+=m._spd.y;m.rotation.z+=m._spd.z;m.position.y+=Math.sin(t+m._floatOffset)*.015});
  particles.rotation.y+=.0003;
  renderer.render(scene,camera);
})();

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ═══ CURSOR ═══
const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.style.left=mx+'px';cur.style.top=my+'px'});
(function animCursor(){rx+=(mx-rx)*.12;ry+=(my-ry)*.12;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animCursor)})();
document.querySelectorAll('a,button,.btn').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ring.style.transform='translate(-50%,-50%) scale(2)'});
  el.addEventListener('mouseleave',()=>{ring.style.transform='translate(-50%,-50%) scale(1)'});
});

// ═══ CARD TILT ═══
document.querySelectorAll('.project-card,.about-card,.skill-card').forEach(card=>{
  card.addEventListener('mousemove',e=>{
    const r=card.getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    const rx2=((y-r.height/2)/r.height)*-8,ry2=((x-r.width/2)/r.width)*8;
    card.style.transform=`perspective(900px) rotateX(${rx2}deg) rotateY(${ry2}deg) translateZ(8px)`;
    card.style.setProperty('--mx',(x/r.width*100)+'%');
    card.style.setProperty('--my',(y/r.height*100)+'%');
  });
  card.addEventListener('mouseleave',()=>{card.style.transform=''});
});

// ═══ LISTEN FOR EDITOR UPDATES ═══
window.addEventListener('message',e=>{
  if(e.data&&e.data.type==='UPDATE_CONFIG'){
    Object.assign(CONFIG,e.data.config);
    applyConfig(CONFIG);
  }
});
</script>
</body>
</html>
